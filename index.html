<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт временно закрыт</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 10% 20%, #cfe9ff, #7ab3c8);
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 60px;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
            display: block;
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            color: #0a2b3e;
            margin-bottom: 15px;
        }

        h1 span {
            background: linear-gradient(120deg, #004466, #0088aa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        p {
            font-size: 20px;
            font-weight: 500;
            color: #1f4e6e;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .sub {
            font-size: 16px;
            font-weight: 400;
            color: #4a6f88;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #cde4f5;
        }

        .emoji-line {
            font-size: 28px;
            letter-spacing: 8px;
            margin-top: 15px;
        }

        @media (max-width: 550px) {
            .card {
                padding: 35px 25px;
                border-radius: 40px;
            }
            h1 {
                font-size: 28px;
            }
            p {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="icon">⏳</span>
        <h1>Сайт временно <span>закрыт</span></h1>
        <p>Мы проводим технические работы.</p>
        <p style="font-size: 18px; color: #2c5a74;">Скоро всё заработает 🙌</p>
        <div class="emoji-line">💧🚛📦</div>
        <div class="sub">
            Спасибо за понимание
        </div>
    </div>

</body>
</html>
